name: Backend CI and Docker Hub

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "bm-backend/**"
      - ".github/workflows/backend-image.yml"
  push:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bm-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bm-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

  publish-image:
    name: Publish Docker Hub image
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bv')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned and latest images
        uses: docker/build-push-action@v6
        with:
          context: ./bm-backend
          file: ./bm-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bookmark-manager-backend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bookmark-manager-backend:latest
